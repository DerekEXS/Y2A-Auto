name: Lint

# 极轻量验证 job（唯一保留的 Actions 工作流）。
# 构建+测试+打包+发 Release 全部在 Codespaces 跑: codespace/build-and-publish.sh
# 设计原则: 不装项目依赖、不跑 pytest、不碰 docker, 目标 <2 分钟。

"on":
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lightweight lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ruff (pinned)
        run: python -m pip install --quiet ruff==0.15.15

      - name: Syntax compile check
        run: python -m compileall -q app.py modules/

      - name: Ruff fatal-only (E9/F63/F7/F82)
        run: ruff check --select E9,F63,F7,F82 app.py modules/
